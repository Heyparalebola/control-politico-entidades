/* ---------------- seguimiento (queda en este navegador) ---------------- */
const SEG_KEY = "cp-seguimiento-v1";
let SEG = {};
try{ SEG = JSON.parse(localStorage.getItem(SEG_KEY) || "{}"); }catch(e){ SEG = {}; }
function guardarSeg(){
  try{ localStorage.setItem(SEG_KEY, JSON.stringify(SEG)); }catch(e){}
}
const SEG_EST = {
  "": {t:"Sin marcar", c:"var(--gris)"},
  respondida:{t:"Respondió", c:"#0F7A3D"},
  evasiva:{t:"Evadió", c:"#E38B0B"},
  pendiente:{t:"Quedó pendiente", c:"#E5484D"}
};
function marcador(id){
  const v = SEG[id] || "";
  return '<div class="marcador" data-seg="'+id+'">'+
    ["respondida","evasiva","pendiente"].map(function(k){
      return '<button type="button" class="m-'+k+(v===k?" on":"")+'" data-val="'+k+'" '+
        'aria-pressed="'+(v===k)+'">'+esc(SEG_EST[k].t)+'</button>';
    }).join("")+'</div>';
}
document.addEventListener("click", function(e){
  const b = e.target.closest(".marcador button"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const cont = b.closest(".marcador"), id = cont.dataset.seg, val = b.dataset.val;
  SEG[id] = (SEG[id]===val) ? "" : val;
  guardarSeg();
  cont.outerHTML = marcador(id);
  const c = $("#seg-cuenta"); if(c) c.textContent = textoSeguimiento();
});
function totalMarcables(){
  let n = GUION.bloques.length;
  ORDEN.forEach(k => n += TABLEROS[k].hilo.length);
  return n;
}
function textoSeguimiento(){
  const m = Object.keys(SEG).filter(k=>SEG[k]).length;
  return m ? m+" de "+totalMarcables()+" preguntas marcadas" : "Ninguna pregunta marcada todavía";
}
function exportarSeguimiento(){
  const lineas = ["SEGUIMIENTO DEL DEBATE — Proposiciones 20, 21 y 25 de 2026", ""];
  GUION.bloques.forEach(function(b,i){
    const v = SEG["g"+i]; if(!v) return;
    lineas.push("["+SEG_EST[v].t.toUpperCase()+"] "+ENT[b.e].n+" · "+b.t);
    lineas.push("   " + b.preg); lineas.push("");
  });
  ORDEN.forEach(function(k){
    TABLEROS[k].hilo.forEach(function(r,i){
      const v = SEG[k+"-h"+i]; if(!v) return;
      lineas.push("["+SEG_EST[v].t.toUpperCase()+"] "+ENT[k].n+" · "+r[0]);
      lineas.push("   " + r[2]); lineas.push("");
    });
  });
  if(lineas.length<=2) lineas.push("Aún no hay preguntas marcadas.");
  copiar(lineas.join("\n"));
}

/* ---------------- matriz de respuestas ---------------- */
function conteo(k){
  const c = {ok:0, media:0, elude:0, nada:0};
  MATRIZ[k].forEach(x => c[x.e]++);
  return c;
}
function vistaMatriz(){
  const cab = '<tr><th class="q">Pregunta del cuestionario</th>'+
    ORDEN.map(k=>'<th class="ent-col" style="--c:'+ENT[k].c+'">'+esc(ENT[k].n)+'</th>').join("")+'</tr>';
  const filas = PREGUNTAS.map(function(p,i){
    return '<tr><td class="q"><b>'+p.n+'.</b> '+esc(p.t)+'</td>'+
      ORDEN.map(function(k){
        const c = MATRIZ[k][i];
        return '<td class="celda"><button type="button" class="est est-'+c.e+'" data-cel="'+k+'-'+i+'"'+
          ' title="'+esc(ENT[k].n+' · pregunta '+p.n+': '+EST[c.e].t)+'">'+esc(EST[c.e].t)+'</button></td>';
      }).join("")+'</tr>';
  }).join("");
  const resumen = ORDEN.map(function(k){
    const c = conteo(k);
    return '<div class="res-ent" style="--c:'+ENT[k].c+'"><b>'+esc(ENT[k].n)+'</b>'+
      '<div class="barras-est">'+["ok","media","elude","nada"].map(function(e){
        return c[e] ? '<span class="seg-est est-'+e+'" style="flex:'+c[e]+'" title="'+EST[e].t+': '+c[e]+'">'+c[e]+'</span>' : '';
      }).join("")+'</div>'+
      '<span class="res-txt">'+c.ok+' responden · '+c.media+' parciales · '+(c.elude+c.nada)+' sin contestar</span></div>';
  }).join("");
  const tot = {ok:0, media:0, elude:0, nada:0};
  ORDEN.forEach(k => { const c=conteo(k); Object.keys(tot).forEach(e => tot[e]+=c[e]); });

  return '<header class="tope" style="--c:#4A5C7A">'+
      '<button class="btn volver" data-ir="portada" type="button">← Inicio</button>'+
      '<h1>Matriz de respuestas <span class="sub">Las 18 preguntas del cuestionario general, entidad por entidad</span></h1>'+
      '<div class="acciones"><button class="btn" id="btn-buscar" type="button">Buscar</button>'+
      '<button class="btn" id="btn-print" type="button">Imprimir</button>'+
      '<button class="btn" id="btn-tema" type="button" aria-pressed="false">Contraste</button></div></header>'+
    '<p class="instruccion">El cuestionario de la Proposición 25 de 2026 es el mismo para todas las entidades citadas: 18 preguntas × '+ORDEN.length+' = '+(18*ORDEN.length)+' casillas. '+
      'De ellas, <b>'+tot.ok+'</b> entregan lo que se pidió, <b>'+tot.media+'</b> responden a medias o remiten a un anexo, <b>'+tot.elude+'</b> contestan otra cosa y <b>'+tot.nada+'</b> se quedan sin respuesta. '+
      'Toque cualquier casilla para ver qué respondió esa entidad y qué quedó faltando.</p>'+
    '<div class="resumen-matriz">'+resumen+'</div>'+
    '<div class="leyenda-est">'+Object.keys(EST).map(e =>
      '<span><i class="est-'+e+'"></i><b>'+EST[e].t+'</b> '+EST[e].d+'</span>').join("")+'</div>'+
    '<div class="tabla-caja matriz-caja"><table class="matriz">'+
      '<thead>'+cab+'</thead><tbody>'+filas+'</tbody></table></div>'+
    '<p class="pie">La calificación de cada casilla es de esta revisión y se basa en el texto de cada respuesta, no en una valoración de la entidad. '+
      'Las respuestas que remiten a un anexo se marcan como parciales cuando el cuerpo del documento no trae la cifra pedida.</p>';
}
function abrirCelda(k, i){
  const c = MATRIZ[k][i], p = PREGUNTAS[i];
  caja.innerHTML =
    '<button class="cerrar" type="button" aria-label="Cerrar">&times;</button>'+
    '<h3 id="modal-titulo">Pregunta '+p.n+' · '+esc(ENT[k].n)+'</h3>'+
    '<div class="ents">'+tag(k)+'<span class="est est-'+c.e+'">'+EST[c.e].t+'</span></div>'+
    '<p class="ambito">'+esc(ENT[k].doc)+'.</p>'+
    '<p class="intro"><b>Lo que preguntó la Comisión:</b> '+esc(p.t)+'</p>'+
    '<div class="cita" style="margin-top:14px"><b>Qué respondió y qué quedó faltando</b>'+esc(c.n)+'</div>'+
    (c.d ? '<div class="rep-caja" style="border-color:var(--linea)"><b>Dato de origen</b>'+
      '<p>Abra la tabla transcrita de la respuesta para ver las cifras completas.</p>'+
      '<button class="btn-claro" type="button" data-det="'+c.d+'">Ver el dato de origen</button></div>' : '')+
    '<p class="fuente-det">Fuente: '+esc(ENT[k].largo)+' · '+esc(ENT[k].doc)+'.</p>';
  ultimoFoco = document.activeElement;
  modal.hidden = false; document.body.style.overflow = "hidden";
  caja.scrollTop = 0; caja.focus();
  caja.querySelector(".cerrar").addEventListener("click", cerrarDetalle);
}

/* ---------------- guion de intervención ---------------- */
function bloqueHTML(b, i, atril){
  return '<article class="bloque'+(atril?" atril-card":"")+'" data-i="'+i+'">'+
    '<div class="b-tope">'+tag(b.e)+'<span class="min">'+esc(b.min)+'</span>'+
      '<h4>'+esc(b.t)+'</h4></div>'+
    '<p class="b-cifra">'+esc(b.cifra)+'</p>'+
    '<p class="b-dice">'+esc(b.dice)+'</p>'+
    '<div class="b-preg"><b>Pregunta</b><p>'+esc(b.preg)+'</p>'+
      '<div class="b-acciones">'+
        '<button class="btn-claro" type="button" data-copiar="'+i+'">Copiar</button>'+
        (b.det ? '<button class="btn-claro" type="button" data-det="'+b.det+'">Ver el dato</button>' : '')+
        marcador("g"+i)+
      '</div></div></article>';
}
function vistaGuion(){
  return '<header class="tope" style="--c:#7A4A6B">'+
      '<button class="btn volver" data-ir="portada" type="button">← Inicio</button>'+
      '<h1>Guion de intervención <span class="sub">'+esc(GUION.bajada)+'</span></h1>'+
      '<div class="acciones">'+
        '<button class="btn" id="btn-atril" type="button">Modo atril</button>'+
        '<button class="btn" id="btn-copiar-guion" type="button">Copiar el guion</button>'+
        '<button class="btn" id="btn-buscar" type="button">Buscar</button>'+
        '<button class="btn" id="btn-print" type="button">Imprimir</button>'+
        '<button class="btn" id="btn-tema" type="button" aria-pressed="false">Contraste</button>'+
      '</div></header>'+
    '<p class="instruccion">Marque cada pregunta durante la sesión: <b>Respondió</b>, <b>Evadió</b> o <b>Quedó pendiente</b>. '+
      'El registro se guarda en este navegador y se puede exportar al final. <span id="seg-cuenta" class="seg-cuenta">'+textoSeguimiento()+'</span> '+
      '<button class="btn-claro" id="btn-exportar" type="button">Exportar el seguimiento</button></p>'+
    '<div class="bloques">'+GUION.bloques.map((b,i)=>bloqueHTML(b,i,false)).join("")+'</div>'+
    '<p class="pie">Los tiempos son indicativos y suman unos 14 minutos. Cada cifra de este guion está transcrita de la respuesta oficial de la entidad correspondiente.</p>';
}
function textoGuion(){
  const l = ["GUION DE INTERVENCIÓN — Comisión Sexta · Proposiciones 20, 21 y 25 de 2026",""];
  GUION.bloques.forEach(function(b,i){
    l.push((i+1)+". ["+b.min+"] "+ENT[b.e].n+" — "+b.t);
    l.push("   Cifra: "+b.cifra);
    l.push("   "+b.dice);
    l.push("   PREGUNTA: "+b.preg);
    l.push("");
  });
  return l.join("\n");
}
/* modo atril: una tarjeta por pantalla, letra grande, flechas */
let atrilIdx = 0;
function abrirAtril(i){
  atrilIdx = i||0;
  const cont = document.createElement("div");
  cont.className = "atril"; cont.id = "atril";
  cont.innerHTML = '<div class="atril-barra">'+
      '<button class="btn-claro" id="atril-prev" type="button">← Anterior</button>'+
      '<span id="atril-pos"></span>'+
      '<button class="btn-claro" id="atril-next" type="button">Siguiente →</button>'+
      '<button class="btn-claro" id="atril-cerrar" type="button">Salir</button>'+
    '</div><div class="atril-cuerpo" id="atril-cuerpo"></div>';
  document.body.appendChild(cont);
  document.body.style.overflow = "hidden";
  pintarAtril();
  $("#atril-prev").addEventListener("click", ()=>moverAtril(-1));
  $("#atril-next").addEventListener("click", ()=>moverAtril(1));
  $("#atril-cerrar").addEventListener("click", cerrarAtril);
}
function pintarAtril(){
  const b = GUION.bloques[atrilIdx];
  $("#atril-cuerpo").innerHTML = bloqueHTML(b, atrilIdx, true);
  $("#atril-pos").textContent = (atrilIdx+1)+" de "+GUION.bloques.length+" · "+b.min;
}
function moverAtril(d){
  atrilIdx = Math.min(GUION.bloques.length-1, Math.max(0, atrilIdx+d));
  pintarAtril();
}
function cerrarAtril(){
  const a = $("#atril"); if(a) a.remove();
  document.body.style.overflow = "";
}
document.addEventListener("keydown", function(e){
  if(!$("#atril")) return;
  if(e.key==="ArrowRight"||e.key===" ") { e.preventDefault(); moverAtril(1); }
  if(e.key==="ArrowLeft") { e.preventDefault(); moverAtril(-1); }
  if(e.key==="Escape") cerrarAtril();
});

/* ---------------- buscador global ---------------- */
let INDICE = null;
function construirIndice(){
  const ix = [];
  const add = (ent, vista, titulo, txt, det) => ix.push({ent:ent, vista:vista, titulo:titulo, txt:(titulo+" "+txt).toLowerCase(), det:det||""});
  ORDEN.forEach(function(k){
    const t = TABLEROS[k];
    t.kpis.forEach(x => add(k, k, x.v+" · "+x.t, "indicador", x.d));
    t.hilo.forEach(r => add(k, k, r[0], r[1]+" "+r[2], r[4]));
    t.hallazgos.forEach(f => add(k, k, f.t, f.d+" "+(f.q||""), f.det||""));
    t.graficas.forEach(g => add(k, k, g.t, g.l, g.det));
    t.proposiciones.forEach(function(p){
      if(!p.puntos) return;
      p.puntos.forEach(pt => add(k, k, pt.t, pt.p+" "+pt.r+" "+pt.q, pt.det));
    });
    MATRIZ[k].forEach((c,i) => add(k, "matriz", "Pregunta "+PREGUNTAS[i].n+" · "+ENT[k].n, PREGUNTAS[i].t+" "+c.n, c.d));
  });
  Object.keys(DETALLES).forEach(function(id){
    const d = DETALLES[id], e = entDe(id);
    let txt = d.intro+" "+(d.cita||"")+" "+d.rep+" "+d.cifra;
    (d.tablas||[]).forEach(tb => { txt += " "+(tb.cap||"")+" "+tb.filas.map(f=>f.join(" ")).join(" "); });
    add(e||"comparado", (e && e!=="comparado") ? e : "cruce", d.t, txt, id);
  });
  GUION.bloques.forEach((b,i) => add(b.e, "guion", "Guion · "+b.t, b.dice+" "+b.preg+" "+b.cifra, b.det));
  CRUCES.forEach(c => add("cruce", "cruce", "Cruce · "+c.t, c.a.txt+" "+c.b.txt+" "+c.n+" "+c.q, c.det));
  return ix;
}
function abrirBuscador(){
  const d = document.createElement("div");
  d.className = "buscador"; d.id = "buscador";
  d.innerHTML = '<div class="b-fondo" data-cerrar-buscador></div>'+
    '<div class="b-caja" role="dialog" aria-modal="true" aria-label="Buscar en el tablero">'+
      '<input id="q" type="search" placeholder="Buscar una cifra, un contrato, una entidad, una palabra…" autocomplete="off">'+
      '<div id="resultados" class="resultados"><p class="b-pista">Escriba al menos dos letras. Por ejemplo: <b>Tumaco</b>, <b>Fondo de Contingencias</b>, <b>reservas</b> o <b>1.063.709</b>.</p></div>'+
    '</div>';
  document.body.appendChild(d);
  document.body.style.overflow = "hidden";
  if(!INDICE) INDICE = construirIndice();
  const inp = $("#q");
  inp.focus();
  inp.addEventListener("input", function(){ pintarResultados(inp.value.trim().toLowerCase()); });
  d.addEventListener("click", function(e){ if(e.target.hasAttribute("data-cerrar-buscador")) cerrarBuscador(); });
}
function pintarResultados(q){
  const cont = $("#resultados");
  if(q.length<2){ cont.innerHTML = '<p class="b-pista">Escriba al menos dos letras.</p>'; return; }
  const terminos = q.split(/\s+/);
  const res = INDICE.filter(x => terminos.every(t => x.txt.indexOf(t)>=0)).slice(0,40);
  if(!res.length){ cont.innerHTML = '<p class="b-pista">Sin resultados para «'+esc(q)+'».</p>'; return; }
  cont.innerHTML = res.map(function(x,i){
    return '<button class="b-res" type="button" data-ir-res="'+i+'">'+tag(x.ent,1)+
      '<span class="b-tit">'+esc(x.titulo)+'</span>'+
      '<span class="b-vista">'+(x.vista==="matriz"?"Matriz":x.vista==="guion"?"Guion":x.vista==="cruce"?"Cruce":ENT[x.vista]?ENT[x.vista].n:"")+'</span></button>';
  }).join("");
  cont.querySelectorAll("[data-ir-res]").forEach(function(b){
    b.addEventListener("click", function(){
      const x = res[+b.dataset.irRes];
      cerrarBuscador();
      ir(x.vista);
      if(x.det) setTimeout(()=>abrirDetalle(x.det, ""), 120);
    });
  });
}
function cerrarBuscador(){
  const b = $("#buscador"); if(b) b.remove();
  document.body.style.overflow = "";
}
document.addEventListener("keydown", function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); if(!$("#buscador")) abrirBuscador(); }
  if(e.key==="Escape" && $("#buscador")) cerrarBuscador();
});

/* arranque, ya con todos los instrumentos definidos */
arrancar();
