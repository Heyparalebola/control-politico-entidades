<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respuesta debate de control político — Comisión Sexta del Senado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --lima:#8CD44F;
  --verde:#0F7A3D;
  --verde-hondo:#0A4F2A;
  --verde-tenue:#EDF5EC;
  --teal:#0B6A5C;
  --azul:#1B4C7E;
  --naranja:#B5500F;
  --tinta:#0E1A13;
  --gris:#57655C;
  --linea:#D6E2D8;
  --fondo:#F5F7F4;
  --tarjeta:#FFFFFF;
  --sombra:0 1px 0 rgba(14,26,19,.05), 0 10px 26px -20px rgba(14,26,19,.55);
  --r:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lima:#8CD44F; --verde:#2E9D5B; --verde-hondo:#9FE3AE; --verde-tenue:#16241B;
    --teal:#4FC0AE; --azul:#79AEE0; --naranja:#F0913F; --tinta:#E9F1E9; --gris:#9FB0A4;
    --linea:#27362B; --fondo:#0D120E; --tarjeta:#151E17;
    --sombra:0 1px 0 rgba(0,0,0,.5), 0 10px 26px -20px #000;
  }
}
:root[data-theme="dark"]{
  --lima:#8CD44F; --verde:#2E9D5B; --verde-hondo:#9FE3AE; --verde-tenue:#16241B;
  --teal:#4FC0AE; --azul:#79AEE0; --naranja:#F0913F; --tinta:#E9F1E9; --gris:#9FB0A4;
  --linea:#27362B; --fondo:#0D120E; --tarjeta:#151E17;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font-family:Barlow,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;}
.lienzo{max-width:1200px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3,h4,h5{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.005em}

/* ---------- encabezado ---------- */
.tope{background:var(--verde);color:#fff;border-radius:var(--r) var(--r) 0 0;
  padding:16px 22px 14px;border-bottom:4px solid var(--lima);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tope h1{margin:0;font-size:clamp(21px,2.7vw,30px);line-height:1.08;flex:1 1 300px}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);
  border-radius:999px;padding:7px 14px;font:600 13px/1 Barlow,sans-serif;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.28)}
.meta{background:var(--tarjeta);border:1px solid var(--linea);border-top:0;
  border-radius:0 0 var(--r) var(--r);padding:12px 22px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px 24px;box-shadow:var(--sombra)}
.meta div{font-size:13.4px;color:var(--gris)}
.meta b{display:block;color:var(--tinta);font-family:Barlow,sans-serif;font-weight:600;font-size:14px}

/* ---------- bloque Respuestas ---------- */
.respuestas{display:grid;grid-template-columns:minmax(210px,278px) 1fr;gap:14px;margin-top:18px}
.rotulo{background:var(--verde-hondo);color:#fff;border-radius:var(--r);padding:18px 20px;
  display:flex;flex-direction:column;justify-content:center;gap:7px}
:root[data-theme="dark"] .rotulo{color:#0D120E}
.rotulo b{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:700;line-height:1}
.rotulo span{font-size:13.4px;line-height:1.4;opacity:.93}
.filas{display:flex;flex-direction:column;gap:12px}
.fila{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);
  padding:12px 14px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;box-shadow:var(--sombra)}
.etiqueta{border-radius:8px;color:#fff;padding:9px 16px;font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.etiqueta--prop{background:var(--teal)}
.etiqueta--ent{background:var(--azul)}
:root[data-theme="dark"] .etiqueta{color:#0D120E}
.etiqueta small{display:block;font-family:Barlow,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:0;opacity:.9}
.botones{display:flex;gap:9px;flex-wrap:wrap;flex:1}
.chip{background:var(--tarjeta);border:1.6px solid var(--linea);border-radius:8px;padding:9px 14px;
  font:600 14.5px/1.15 Barlow,sans-serif;color:var(--tinta);cursor:pointer;display:flex;
  flex-direction:column;gap:3px;align-items:flex-start;min-width:112px;position:relative;
  transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--verde)}
.chip[aria-expanded="true"]{border-color:var(--verde);background:var(--verde-tenue);box-shadow:inset 0 -3px 0 var(--verde)}
.chip[data-tipo="prop"][aria-expanded="true"]{border-color:var(--teal);box-shadow:inset 0 -3px 0 var(--teal)}
.chip em{font:500 11.5px/1.15 Barlow,sans-serif;font-style:normal;color:var(--gris)}
.chip.mudo em{color:var(--naranja)}
.chip:focus-visible,.btn:focus-visible,.cerrar:focus-visible,.copiar:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}

/* ---------- panel ---------- */
.panel{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);
  border-left:6px solid var(--verde);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sombra)}
.panel[hidden]{display:none}
.panel.prop{border-left-color:var(--teal)}
.panel.ent{border-left-color:var(--azul)}
.panel-tope{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px 12px}
.panel-tope h3{margin:0;font-size:25px;line-height:1.12}
.panel-tope p{grid-column:1/-1;margin:0;color:var(--gris);font-size:14px;max-width:92ch}
.btn-claro{border:1px solid var(--linea);background:transparent;color:var(--gris);border-radius:999px;
  padding:6px 13px;font:600 12.5px/1 Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.btn-claro:hover{color:var(--tinta);border-color:var(--gris)}
.btn-claro:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.grupo{grid-column:1/-1;margin:20px 0 -4px;font-size:13px;font-family:Barlow,sans-serif;font-weight:700;
  letter-spacing:.05em;color:var(--gris);display:flex;align-items:center;gap:10px}
.grupo::after{content:"";flex:1;height:1px;background:var(--linea)}
.cerrar{border:1px solid var(--linea);background:transparent;color:var(--gris);border-radius:999px;
  width:34px;height:34px;font-size:19px;line-height:1;cursor:pointer}
.cerrar:hover{color:var(--tinta);border-color:var(--gris)}
.estado{border-radius:999px;padding:5px 12px;font:600 12.5px/1 Barlow,sans-serif;white-space:nowrap;align-self:center}
.estado.si{background:var(--verde-tenue);color:var(--verde);border:1px solid var(--verde)}
.estado.no{background:transparent;color:var(--naranja);border:1px solid var(--naranja)}

.punto{border-top:1px solid var(--linea);padding:17px 0 6px;display:grid;grid-template-columns:36px 1fr;gap:14px}
.punto:first-of-type{margin-top:12px}
.punto .num{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-weight:700;color:var(--teal);line-height:1}
.punto h4{margin:0 0 9px;font-size:18px;line-height:1.2}
.punto dl{margin:0;display:grid;gap:10px}
.punto dt{font:600 11.6px/1.2 Barlow,sans-serif;color:var(--gris);letter-spacing:.05em}
.punto dd{margin:3px 0 0;font-size:15px;max-width:80ch}
.punto .rep dt{color:var(--naranja)}
.punto .rep dd{border-left:3px solid var(--naranja);padding-left:12px}
.ref{display:inline-block;margin-left:8px;border:1px solid var(--linea);border-radius:4px;
  padding:1px 6px;font:600 11px/1.5 Barlow,sans-serif;color:var(--gris);vertical-align:2px;white-space:nowrap}

.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;margin-top:18px}
.ficha{border:1px solid var(--linea);border-radius:9px;padding:14px 15px;background:var(--verde-tenue)}
.ficha h5{margin:0 0 8px;font-size:15.5px;line-height:1.2;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ficha ul{margin:0;padding-left:17px;font-size:13.9px;display:grid;gap:5px}
.ficha .cifra{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;
  color:var(--verde);line-height:1.05;display:block;margin-bottom:6px}
.panel.ent .ficha .cifra{color:var(--c-ent,var(--verde))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel.ent .ficha .cifra{color:var(--verde-hondo)}}
:root[data-theme="dark"] .panel.ent .ficha .cifra{color:var(--verde-hondo)}
.vacio{margin:16px 0 0;padding:16px 18px;border:1px dashed var(--linea);border-radius:9px;
  font-size:15px;color:var(--gris);max-width:78ch}

/* ---------- secciones ---------- */
.seccion{margin-top:32px}
.barra{background:var(--verde);color:#fff;border-radius:var(--r);padding:14px 22px;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;border-left:6px solid var(--lima)}
.barra h2{margin:0;font-size:clamp(19px,2.3vw,26px);line-height:1.12}
.barra .apunte{grid-column:1/-1;font-size:13.4px;opacity:.93;font-weight:500;max-width:92ch}

.tabla-caja{margin-top:13px;background:var(--tarjeta);border:1px solid var(--linea);
  border-radius:var(--r);overflow-x:auto;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.2px}
caption{caption-side:top;text-align:left;padding:14px 18px 2px;font:500 13.4px/1.4 Barlow,sans-serif;color:var(--gris)}
th,td{padding:13px 16px;border-bottom:1px solid var(--linea);vertical-align:top;text-align:left}
thead th{background:var(--verde-tenue);font:700 12.4px/1.2 Barlow,sans-serif;letter-spacing:.05em;color:var(--verde)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--verde-tenue)}
td.n{font-family:"Barlow Condensed",sans-serif;font-size:23px;font-weight:700;color:var(--verde);width:46px}
td.rep{color:var(--naranja);font-weight:500;position:relative;padding-right:42px}
.copiar{position:absolute;top:9px;right:8px;border:1px solid var(--linea);background:var(--tarjeta);
  color:var(--gris);border-radius:6px;width:28px;height:26px;font-size:12px;cursor:pointer;line-height:1}
.copiar:hover{color:var(--tinta);border-color:var(--gris)}
.copiar.ok{color:var(--verde);border-color:var(--verde)}
@media (max-width:760px){
  .tabla-caja table,.tabla-caja thead,.tabla-caja tbody,.tabla-caja tr,.tabla-caja td{display:block;min-width:0}
  .tabla-caja thead{display:none}
  .tabla-caja tbody tr{border-bottom:1px solid var(--linea);padding:8px 0}
  .tabla-caja tbody tr:last-child{border-bottom:0}
  .tabla-caja td{border:0;padding:6px 16px}
  .tabla-caja td::before{content:attr(data-th);display:block;font:700 11.4px/1.2 Barlow,sans-serif;
    letter-spacing:.05em;color:var(--gris);margin-bottom:3px}
  .tabla-caja td.n::before{content:none}
  .tabla-caja td.rep{padding-right:48px}
  .t-det{min-width:520px}
  .caja-tabla .cap::after{content:" · deslice la tabla →";color:var(--verde);font-weight:700}
  .modal-caja{padding:18px 16px 24px}
  .modal-caja h3{font-size:21px}
}

/* ---------- datos ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-top:13px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--tarjeta);border:1px solid var(--linea);border-top:4px solid var(--verde);
  border-radius:9px;padding:13px 15px;box-shadow:var(--sombra)}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1.05}
.kpi span{display:block;font-size:13px;color:var(--gris);margin-top:4px}
.kpi .ref{margin:7px 0 0;display:inline-block}
.kpi.alerta{border-top-color:var(--naranja)}
.kpi.alerta b{color:var(--naranja)}
.graficas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:14px}
.grafica{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);
  padding:16px 18px 18px;box-shadow:var(--sombra);display:flex;flex-direction:column}
.grafica h4{margin:0 0 3px;font-size:17px;line-height:1.15}
.grafica p.lectura{margin:0 0 14px;font-size:13.4px;color:var(--gris);max-width:62ch}
.grafica svg{width:100%;height:auto;display:block;overflow:visible;color:var(--tinta)}
.grafica svg.rosca{max-width:250px;margin:2px auto 0}
.leyenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:5px 14px;
  margin-top:12px;font-size:12.8px}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:7px}
.leyenda span{color:var(--gris)}
.grafica .ref{margin-top:auto;align-self:flex-start;padding-top:0}
.pie{margin-top:36px;font-size:13px;color:var(--gris);border-top:1px solid var(--linea);
  padding-top:14px;max-width:86ch}
.aviso{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--verde-hondo);
  color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--sombra);z-index:9}
:root[data-theme="dark"] .aviso{color:#0D120E}
.aviso[hidden]{display:none}
@media (max-width:760px){
  .respuestas{grid-template-columns:1fr}
  .fila{flex-direction:column;align-items:stretch;gap:10px}
  .etiqueta{text-align:left}
  .chip{min-width:0;flex:1 1 44%}
  .panel-tope{grid-template-columns:1fr auto}
  .panel-tope h3{font-size:21px}
  .panel-tope .estado,.panel-tope .btn-claro{grid-column:1/-1;justify-self:start}
  .lienzo{padding:14px 12px 46px}
  .panel{padding:16px 15px}
  .punto{grid-template-columns:28px 1fr;gap:11px}
  .tope{padding:14px 16px 12px}
  .meta{padding:11px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- insignias de entidad y gravedad ---------- */
.ent-tag.mini{font-size:10.2px;padding:2px 7px;margin-right:0}
.fuente-chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;vertical-align:2px}
.kpi .fuente-chip{margin-top:8px}
.kpi .fuente-chip .ent-tag,.grafica .fuente-chip .ent-tag{display:inline-block;color:#fff;font-size:10.2px;margin:0}
:root[data-theme="dark"] .kpi .fuente-chip .ent-tag,
:root[data-theme="dark"] .grafica .fuente-chip .ent-tag{color:#0D120E}
.kpi .fuente-chip .ref,.grafica .fuente-chip .ref{display:inline-block;margin:0;font-size:10.8px}
.grafica .fuente-chip{flex-wrap:wrap;white-space:normal}
.grafica .leyenda>div{min-width:0}
.grafica .leyenda .fuente-chip .ref{white-space:normal}
.fuente-chip .ref{margin-left:0}
.clavecolor{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:8px 18px;align-items:start;margin-top:2px;
  background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:10px 14px;box-shadow:var(--sombra)}
.clavecolor b{grid-column:1/-1;font:700 11.4px/1.2 Barlow,sans-serif;letter-spacing:.05em;color:var(--gris);margin-bottom:2px}
.clavecolor .item{display:flex;align-items:baseline;gap:7px;font-size:12.6px;color:var(--gris);line-height:1.35}
.clavecolor .item i{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none;position:relative;top:1px}
.clavecolor .item span{color:var(--tinta);font-weight:600}
.ents{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.ents .rot{font:700 11.2px/1.2 Barlow,sans-serif;letter-spacing:.05em;color:var(--gris);margin-right:2px}
.ents .rot.no{margin-left:10px;color:var(--naranja)}
.ents .ent-tag{margin-right:0}
.ents .ent-tag.apagado{background:transparent;color:var(--naranja);border:1px dashed var(--naranja)}
.modal-caja .ents{margin:10px 0 0}
.modal-caja .ambito{grid-column:1/-1;font-size:12.8px;color:var(--gris);margin:6px 0 0}
.panel.ent{border-left-color:var(--c-ent,var(--azul))}
.punto .quien{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.punto .quien div{font-size:14.4px;padding-left:2px}
.punto .quien .ent-tag{margin-right:7px}
.ent-tag{display:inline-block;border-radius:5px;padding:2px 8px;margin-right:8px;
  font:700 11px/1.5 Barlow,sans-serif;letter-spacing:.04em;color:#fff;background:var(--c,var(--verde));white-space:nowrap}
:root[data-theme="dark"] .ent-tag{color:#0D120E}
.sev{display:inline-block;border-radius:999px;padding:2px 9px;margin-right:8px;
  font:700 10.8px/1.6 Barlow,sans-serif;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.sev.grave{background:#FBE7E7;color:#B3272C;border:1px solid #E5484D}
.sev.media{background:#FDF1DF;color:#8A5A07;border:1px solid #E38B0B}
.sev.alerta{background:#E7F1FB;color:#1C5D96;border:1px solid #2D8FE0}
.sev.forma{background:transparent;color:var(--gris);border:1px solid var(--linea)}
:root[data-theme="dark"] .sev.grave{background:#3A1E20;color:#FF9B9E}
:root[data-theme="dark"] .sev.media{background:#3A2C15;color:#F3B65C}
:root[data-theme="dark"] .sev.alerta{background:#16293A;color:#8CC3F0}
.hallazgo{border:1px solid var(--linea);border-radius:9px;padding:13px 15px;background:var(--tarjeta)}
.hallazgo h5{margin:0 0 6px;font-size:15px;line-height:1.25}
.hallazgo p{margin:0;font-size:13.8px;color:var(--tinta)}
.hallazgo .preg{margin-top:9px;padding-left:11px;border-left:3px solid var(--naranja);font-size:13.8px;color:var(--tinta)}
.hallazgo .pag{display:block;margin-top:8px;font:600 11.2px/1.2 Barlow,sans-serif;color:var(--gris);letter-spacing:.04em}
.lista-hallazgos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.lectura{margin:14px 0 0;padding:0 0 0 14px;border-left:3px solid var(--verde);display:grid;gap:8px}
.lectura p{margin:0;font-size:14.6px;max-width:92ch}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 0}
.filtro{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:999px;padding:7px 14px;
  font:600 13.4px/1 Barlow,sans-serif;color:var(--tinta);cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
:root[data-theme="dark"] .filtro[aria-pressed="true"]{color:#0D120E}
.filtro:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}

/* ---------- cruces entre entidades ---------- */
.cruces{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;margin-top:14px}
.cruce{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra)}
.cruce h4{margin:0 0 10px;font-size:17.5px;line-height:1.2}
.versus{display:grid;gap:10px}
.voz{border-left:4px solid var(--c,var(--verde));padding:9px 12px;background:var(--verde-tenue);border-radius:0 8px 8px 0}
.voz b{display:block;font:700 11.6px/1.3 Barlow,sans-serif;letter-spacing:.05em;color:var(--c,var(--verde));margin-bottom:4px}
.voz span{font-size:13.9px}
.cruce .nt{margin:11px 0 0;font-size:13.6px;color:var(--gris)}
.cruce .ask{margin:12px 0 0;padding:11px 13px;border:1px solid var(--naranja);border-radius:9px}
.cruce .ask b{display:block;font:700 11.4px/1.3 Barlow,sans-serif;letter-spacing:.05em;color:var(--naranja);margin-bottom:4px}
.cruce .ask p{margin:0 0 9px;font-size:14.2px}

/* ---------- cronología ---------- */
.crono{margin-top:14px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);
  padding:16px 20px;box-shadow:var(--sombra)}
.crono-mes{margin:16px 0 8px;font:700 11.6px/1.2 Barlow,sans-serif;letter-spacing:.06em;color:var(--verde)}
.crono-mes:first-child{margin-top:0}
.hito{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--linea)}
.hito time{font:600 12.6px/1.5 Barlow,sans-serif;color:var(--gris);white-space:nowrap}
.hito div{font-size:14.2px}
.hito.clave{background:var(--verde-tenue);margin:0 -10px;padding:8px 10px;border-radius:7px}

/* ---------- elementos con detalle ---------- */
@keyframes aparece{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.rosca.entra .dato{opacity:0;animation:aparece .5s cubic-bezier(.2,.7,.3,1) forwards;
  transform-box:view-box;transform-origin:100px 100px}
.dato{cursor:pointer}
.dato rect,.dato path,.dato circle{transition:opacity .15s,filter .15s,transform .15s}
.dato:hover rect,.dato:hover path{filter:brightness(1.12)}
.grafica:hover .dato:not(:hover) path{opacity:.62}
.dato:focus{outline:none}
.dato:focus-visible rect,.dato:focus-visible path{stroke:var(--naranja);stroke-width:2.5;paint-order:stroke}
.rosca text{pointer-events:none}
.dato.rebana{transform-box:view-box;transform-origin:100px 100px}
.dato.rebana:hover{transform:scale(1.035)}
.leyenda div.dato{border-radius:5px;padding:1px 4px;margin:-1px -4px}
.leyenda div.dato:hover{background:var(--verde-tenue)}
.kpi.dato:hover{border-color:var(--verde);transform:translateY(-1px)}
.kpi.dato{transition:transform .15s,border-color .15s,box-shadow .15s}
.kpi.dato:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.kpi .lupa{float:right;font-size:12px;color:var(--gris);opacity:.55}
button.repregunta{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  font:inherit;color:var(--naranja);cursor:pointer;border-bottom:1px dotted transparent}
button.repregunta:hover{border-bottom-color:var(--naranja)}
button.repregunta:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:3px}
.punto .rep button.repregunta{border-left:3px solid var(--naranja);padding-left:12px;color:var(--tinta)}
.punto .rep button.repregunta:hover{background:var(--verde-tenue)}
.pista{display:block;margin-top:6px;font:600 11.4px/1.2 Barlow,sans-serif;letter-spacing:.04em;color:var(--gris)}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--tinta);color:var(--fondo);
  padding:6px 10px;border-radius:7px;font:500 12.6px/1.35 Barlow,sans-serif;max-width:250px;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.tip[hidden]{display:none}
.tip b{font-family:"Barlow Condensed",sans-serif;font-size:15px;display:block}

/* ---------- modal de detalle ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.modal-fondo{position:absolute;inset:0;background:rgba(8,20,12,.55)}
.modal-caja{position:relative;background:var(--tarjeta);width:min(920px,100%);
  max-height:min(88vh,900px);overflow-y:auto;border-radius:14px 14px 0 0;padding:22px 26px 28px;
  box-shadow:0 -10px 40px -14px rgba(0,0,0,.5);border-top:5px solid var(--verde)}
@media (min-width:720px){
  .modal{align-items:center}
  .modal-caja{border-radius:14px;max-height:86vh}
}
.modal-caja h3{margin:0 0 2px;font-size:25px;line-height:1.14;padding-right:44px}
.modal-cifra{font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:700;color:var(--verde);line-height:1.1}
.modal-caja .intro{margin:6px 0 0;color:var(--gris);font-size:14.4px;max-width:88ch}
.t-det{width:100%;min-width:0;border-collapse:collapse;font-size:13.4px;margin-top:8px}
.t-det th,.t-det td{padding:8px 11px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.t-det thead th{background:var(--verde-tenue);color:var(--verde);font:700 11.8px/1.2 Barlow,sans-serif;letter-spacing:.04em}
.t-det td.num,.t-det th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-det tr.foco{background:var(--verde-tenue);box-shadow:inset 3px 0 0 var(--verde)}
.t-det i.pt{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;position:relative;top:0}
.t-det tr.tot td{font-weight:700;border-top:2px solid var(--linea);border-bottom:0}
.caja-tabla{overflow-x:auto;border:1px solid var(--linea);border-radius:9px;margin-top:14px}
.caja-tabla .cap{padding:10px 12px 0;font:600 12.6px/1.3 Barlow,sans-serif;color:var(--gris)}
.cita{margin:16px 0 0;padding:12px 15px;background:var(--verde-tenue);border-radius:9px;
  font-size:14.2px;max-width:92ch}
.cita b{display:block;font:700 11.6px/1.3 Barlow,sans-serif;letter-spacing:.05em;color:var(--gris);margin-bottom:5px}
.rep-caja{margin:14px 0 0;padding:12px 15px;border:1px solid var(--naranja);border-radius:9px;max-width:92ch}
.rep-caja b{display:block;font:700 11.6px/1.3 Barlow,sans-serif;letter-spacing:.05em;color:var(--naranja);margin-bottom:5px}
.rep-caja p{margin:0;font-size:14.6px}
.rep-caja .btn-claro{margin-top:10px}
.fuente-det{margin:16px 0 0;font-size:12.6px;color:var(--gris)}
.modal .cerrar{position:absolute;top:18px;right:20px;background:var(--tarjeta)}

/* ---------- impresión ---------- */
.solo-impresion{display:none}
@media print{
  @page{size:A4;margin:14mm}
  :root{--fondo:#fff;--tarjeta:#fff;--tinta:#111;--gris:#444;--linea:#bbb;--verde-tenue:#f2f7f2;--sombra:none}

/* ---------- portada y navegación entre vistas ---------- */
.tope{background:var(--c,var(--verde))}
.tope.portada{background:linear-gradient(95deg,var(--verde-claro),var(--verde))}

  opacity:.92;letter-spacing:0;margin-top:3px}

.instruccion{margin:22px 2px 0;font-size:15.4px;color:var(--gris);max-width:78ch}

.entrada{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;
  background:var(--tarjeta);border:1px solid var(--linea);border-left:7px solid var(--c);
  border-radius:var(--r);padding:20px 22px 16px;cursor:pointer;box-shadow:var(--sombra);

.entrada .sigla{font-family:"Barlow Condensed",sans-serif;font-size:33px;font-weight:700;line-height:1;color:var(--c)}
.entrada .nombre{font-size:14.6px;font-weight:600;line-height:1.25}
.entrada .nota{font-size:13.6px;color:var(--gris);line-height:1.45}
.entrada .pie{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;width:100%;
  border-top:1px solid var(--linea);padding-top:10px}
.entrada .cont{font:600 12.4px/1.2 Barlow,sans-serif;color:var(--gris)}
.entrada .ir{margin-left:auto;font:700 12.8px/1.2 Barlow,sans-serif;color:var(--c)}
.cruces-link{margin-top:14px;flex-direction:row;align-items:center;gap:16px;flex-wrap:wrap}

@media (max-width:760px){

}

  .entrada,.instruccion,.volver{display:none!important}
}

/* ---------- portada: secciones e instrumentos ---------- */
.rotulo-seccion{margin:26px 2px 2px;font-family:"Barlow Condensed",sans-serif;font-size:20px;
  letter-spacing:.02em;color:var(--verde)}
.instrumentos .entrada .sigla{font-size:28px}
.seg-portada{margin:22px 2px 0;font-size:14px;color:var(--gris);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.tope kbd{font:600 11px/1 Barlow,sans-serif;border:1px solid rgba(255,255,255,.55);border-radius:4px;
  padding:2px 5px;margin-left:6px;opacity:.9}

/* ---------- matriz ---------- */
.resumen-matriz{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.res-ent{background:var(--tarjeta);border:1px solid var(--linea);border-left:5px solid var(--c);
  border-radius:9px;padding:12px 14px;box-shadow:var(--sombra)}
.res-ent b{font-family:"Barlow Condensed",sans-serif;font-size:20px;color:var(--c)}
.barras-est{display:flex;gap:2px;margin:8px 0 6px;height:18px;border-radius:4px;overflow:hidden}
.barras-est .seg-est{display:flex;align-items:center;justify-content:center;
  font:700 11px/1 Barlow,sans-serif;color:#fff;min-width:18px}
.res-txt{font-size:12.6px;color:var(--gris)}
.est-ok{background:#0F7A3D}
.est-media{background:#E38B0B}
.est-elude{background:#E5484D}
.est-nada{background:#6B7F72}
.leyenda-est{display:flex;gap:18px;flex-wrap:wrap;margin:14px 2px 0;font-size:12.8px;color:var(--gris)}
.leyenda-est i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
.leyenda-est b{color:var(--tinta)}
.matriz-caja{margin-top:12px}
table.matriz{min-width:820px;font-size:13.6px}
table.matriz td.q{width:46%;line-height:1.35}
table.matriz td.q b{color:var(--verde);font-family:"Barlow Condensed",sans-serif;font-size:16px;margin-right:4px}
table.matriz th.ent-col{color:#fff;background:var(--c);text-align:center;font-size:13px;letter-spacing:.03em}
table.matriz td.celda{text-align:center;padding:8px}
table.matriz tbody tr:hover{background:var(--verde-tenue)}
.est{display:inline-block;border-radius:999px;padding:5px 12px;color:#fff;
  font:700 11.4px/1.25 Barlow,sans-serif;border:0;cursor:pointer;white-space:nowrap}
button.est:hover{filter:brightness(1.12)}
button.est:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.modal-caja .est{cursor:default;margin-left:4px}

/* ---------- guion ---------- */
.bloques{display:grid;gap:14px;margin-top:16px}
.bloque{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sombra)}
.b-tope{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-tope h4{margin:0;font-size:20px;line-height:1.15;flex:1 1 260px}

  border-radius:999px;padding:4px 10px}

.b-preg p{margin:0;font-size:16px;font-weight:500}
.b-acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* marcador de seguimiento */
.marcador{display:inline-flex;gap:0;border:1px solid var(--linea);border-radius:999px;overflow:hidden}
.marcador button{border:0;background:transparent;color:var(--gris);cursor:pointer;

.b-fondo{position:absolute;inset:0;background:rgba(8,20,12,.55)}

.b-caja input{border:0;border-bottom:1px solid var(--linea);padding:18px 20px;font:500 17px/1.3 Barlow,sans-serif;
  background:transparent;color:var(--tinta);outline:none;width:100%}
.resultados{overflow-y:auto}
.b-pista{margin:0;padding:18px 20px;font-size:13.6px;color:var(--gris)}
.b-res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--linea);padding:12px 18px;cursor:pointer;font:inherit;color:var(--tinta)}
.b-res:hover{background:var(--verde-tenue)}
.b-tit{flex:1;font-size:14.4px;line-height:1.3}
.b-vista{font:600 11.4px/1 Barlow,sans-serif;color:var(--gris);border:1px solid var(--linea);
  border-radius:999px;padding:4px 9px;white-space:nowrap}

  .bloque{break-inside:avoid;border:0;border-bottom:1px solid #bbb;border-radius:0;padding:8pt 0}

}

/* ---------- portada agrupada por sectores ---------- */
.sector{margin-top:14px}
.sector-rot{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;

.sector-rot span{font:600 11.6px/1 Barlow,sans-serif;color:var(--gris);border:1px solid var(--linea);
  border-radius:999px;padding:3px 9px;order:3}

/* ==================== MINISTERIO DE TRANSPORTE ==================== */
mintra:{
  id:"mintra",
  titulo:"Ministerio de Transporte",
  resumen:"Cabeza del sector. Respondió las tres proposiciones, trasladó a la Aerocivil, la ANI y el INVÍAS casi todo el cuestionario sectorial, y se acogió al término de treinta días de la Ley 951 para no entregar el diagnóstico definitivo.",
  meta:[
    ["Entidad","Ministerio de Transporte · cabeza del sector"],
    ["Firma","Elsa Margarita Noguera de la Espriella, Ministra de Transporte"],
    ["Documento","Radicado MT 20261081364661 del 18 de septiembre de 2026 · 36 páginas · 26 anexos"],
    ["Responde","Proposiciones 20/26, 21/26 y 25/26, con el cuestionario general y el sectorial"],
    ["Citación que atiende","Radicado MT 20263031649722 del 7 de septiembre de 2026"],
    ["Traslados","Radicados MT 20261081309091, 20261081309061 y 20261081309071 a la Aerocivil, la ANI y el INVÍAS"]
  ],
  lectura:[
    "Es la única entidad que invoca el artículo 13 de la Ley 951 de 2005: dice que está dentro del término de treinta días para verificar los informes de gestión de la administración saliente y que, mientras eso ocurra, «no se dispone todavía de un diagnóstico definitivo y plenamente validado». Con ese argumento deja sin responder las preguntas 13, 17 y 18.",
    "Declara $7.361.336.428.538 en pasivos contingentes por 635 procesos judiciales, el monto más alto de todo el paquete, y aclara que la cifra no incluye arbitrajes ni garantías: eso «deberá solicitarse de manera independiente».",
    "Reporta que el sector transporte llegó al 7 de agosto con $5.026.123.514.237 de apropiación pendiente por comprometer, repartidos en 174 proyectos de inversión."
  ],
  proposiciones:[
    {id:"p20", rotulo:"Proposición 20", pie:"diagnóstico y PGN 2027", respondio:true,
     titulo:"Proposición 20 de 2026 — diagnóstico inicial de recepción y presupuesto 2027",
     bajada:"Retos del empalme por viceministerios, prioridades legislativas, recursos para las regiones y necesidades para la vigencia 2027.",
     puntos:[
       {t:"Los muertos en las vías subieron 16,5% en tres años", ref:"p. 1–2", det:"mintra_vial",
        p:"¿Cuáles son los principales retos del diagnóstico inicial en materia de transporte?",
        r:"Según las cifras oficiales recibidas en el empalme, los fallecidos en siniestros viales pasaron de 7.238 en 2021 a 8.433 en 2024: 1.195 muertes más, un aumento del 16,5%. Los lesionados valorados por Medicina Legal subieron 27,4%. A junio de 2026 ya iban 4.751 fallecidos y, de mantenerse el ritmo, el ministerio estima un cierre anual cercano a 9.500.",
        q:"¿Qué medidas concretas se van a adoptar para revertir una tendencia que ya suma tres años al alza y proyecta 9.500 muertes en 2026?"},
       {t:"Sacar la licencia costaría 57% más", ref:"p. 2", det:"mintra_cale",
        p:"¿Qué encontró el ministerio sobre los costos de los trámites de tránsito?",
        r:"El esquema de Centros de Apoyo Logístico de Evaluación, los CALE, podría llevar el costo de la licencia de conducción de unos $1.400.000 a $2.200.000: cerca de $800.000 adicionales por usuario. Había 32 sedes registradas para atender 1.102 municipios y «no se identificó un estudio publicado» que midiera el impacto sobre el costo final. Entre 2025 y 2026 algunos trámites subieron entre 18% y 21%.",
        q:"¿Se va a suspender o revisar el esquema CALE y quién autorizó un incremento del 57% sin estudio publicado de impacto?"},
       {t:"La inversión en infraestructura, en uno de sus niveles más bajos", ref:"p. 3", det:"mintra_infra",
        p:"¿Cómo se recibió el frente de infraestructura?",
        r:"«El sector se recibe con presiones financieras y de ejecución significativas». La inversión nacional está cerca del 14% del PIB, «uno de los niveles más bajos de las últimas décadas», cuando —según el ministerio— se requiere superar el 25%. La agenda normativa está detenida: 13 de 45 actos en trámite son de infraestructura.",
        q:"¿Cuál es la ruta para pasar del 14% al 25% del PIB en inversión y en qué plazo se destraban los 13 actos normativos pendientes?"},
       {t:"Sedes de más de 50 años fuera de norma sismorresistente", ref:"p. 5–7", det:"mintra_necesidades",
        p:"¿Qué necesidades presupuestales identifica para 2027?",
        r:"Cuatro frentes: modernización tecnológica, gestión documental —con un hallazgo del Archivo General de la Nación por la ausencia de tablas de valoración documental y los fondos acumulados de Foncolpuertos, Ferrovías, Intra y Navenal—, mantenimiento de sus 59 puntos de atención, «la mayoría con más de 50 años de construcción y fuera del alcance de las normas de sismorresistencia», y la revisión de su contratación de prestación de servicios.",
        q:"¿Cuántas de las 59 sedes tienen estudio de vulnerabilidad sísmica y qué recursos se pidieron para 2027 en ese frente?"},
       {t:"Revisión de la contratación firmada en la transición", ref:"p. 7", det:"mintra_contratacion",
        p:"¿Qué encontró en su propia contratación?",
        r:"El ministerio señala que presenta «comportamientos y concentraciones contractuales que justifican revisiones específicas», y menciona tres: los incrementos significativos de honorarios, la contratación suscrita en la transición de gobierno y los criterios de planeación que sustentaron la alta concentración de contratos al inicio de 2026.",
        q:"¿Cuántos contratos se firmaron en la transición de gobierno, por qué valor, y qué incrementos de honorarios están bajo revisión?"}
     ]},
    {id:"p21", rotulo:"Proposición 21", pie:"sismo del 10 de agosto", respondio:true,
     titulo:"Proposición 21 de 2026 — sismo del 10 de agosto y capacidad de respuesta del sector",
     bajada:"Balance de recepción del sector, ejecución para la emergencia, contratación de urgencia, pólizas y concurrencia territorial.",
     puntos:[
       {t:"La respuesta al sismo repite el diagnóstico de la otra proposición", ref:"p. 13–21", det:"mintra_sismo",
        p:"¿Cuál es el balance del sector frente a la emergencia?",
        r:"El primer punto de la Proposición 21 reproduce íntegramente, párrafo por párrafo, el diagnóstico entregado en la Proposición 20: los mismos datos de seguridad vial, los mismos CALE, las mismas necesidades de 2027. Lo específico del sismo se limita a cinco viñetas sobre recuperación de la movilidad en Buga–Buenaventura y el Eje Cafetero.",
        q:"¿Cuál es el balance propio del sector frente al sismo, con cifras de daños, costos y cronogramas?"},
       {t:"Cero pesos movidos y cero contratos de urgencia", ref:"p. 18–19", det:"mintra_sismo",
        p:"¿Qué recursos y contratos se movilizaron bajo la declaratoria de desastre?",
        r:"No se realizaron traslados, adiciones ni liberaciones presupuestales bajo la declaratoria de desastre; no se hicieron solicitudes formales a Hacienda ni al DNP para blindar partidas en el presupuesto de 2027; y no se tramitó ningún contrato por urgencia manifiesta o contratación directa por desastre.",
        q:"Si la recuperación de las vías es un reto declarado del sector, ¿con qué recursos y con qué figura contractual se está atendiendo?"},
       {t:"Las preguntas técnicas van a las entidades adscritas", ref:"p. 13 y 19–21", det:"mintra_traslados",
        p:"¿Qué informa el ministerio sobre daños, pólizas y cronogramas de obra?",
        r:"Traslada la pregunta a la Aerocivil, la ANI y el INVÍAS mediante tres radicados. Sobre sus propias pólizas informa el Contrato 739 de 2025, cuyo Lote 1 incluye el seguro de todo riesgo daños materiales, sin reclamaciones asociadas al sismo.",
        q:"¿Quién consolida, como cabeza de sector, el balance de daños y de reclamaciones de todas las entidades adscritas?"}
     ]},
    {id:"p25", rotulo:"Proposición 25", pie:"entrega de la entidad", respondio:true,
     titulo:"Proposición 25 de 2026 — cómo quedó entregada la entidad y el sector",
     bajada:"Cuestionario general de 18 preguntas y cuestionario específico del sector transporte, con 26 anexos.",
     puntos:[
       {t:"Ejecución del 58,9% con el 60% del año corrido", ref:"p. 23", det:"mintra_ejec",
        p:"¿Cuál era la situación presupuestal al 7 de agosto de 2026?",
        r:"Apropiación vigente de $254.941.056.727, con compromisos por $150.166.537.719,97, obligaciones por $110.925.646.154,24 y pagos por $99.356.955.357,69. Por componente: funcionamiento 66,26%, inversión 53,98% y total 58,90%. Las cuentas por pagar de 2025 quedaron pagadas al 100%.",
        q:"¿Cuánto de la inversión comprometida y no obligada se va a convertir en reservas al 31 de diciembre?"},
       {t:"$7,36 billones en pasivos contingentes, sin contar arbitrajes", ref:"p. 25–26", det:"mintra_judicial",
        p:"¿Cuál era el monto total de los pasivos contingentes?",
        r:"$7.361.336.428.538,05 en 635 procesos judiciales activos calificados con probabilidad media o baja, el 99,96% en la jurisdicción contencioso administrativa. Aparte, 137 procesos con probabilidad alta ya están provisionados por $138.906.614.174,75. La respuesta excluye expresamente controversias extrajudiciales, arbitrajes y garantías.",
        q:"¿Cuál es el valor de los arbitrajes y las garantías que la respuesta excluyó, y por qué no se incluyeron si el cuestionario los pedía?"},
       {t:"$5,03 billones del sector sin comprometer", ref:"p. 27", det:"mintra_sincomprometer",
        p:"¿Qué proyectos contaban con recursos asignados pero sin contrato de ejecución?",
        r:"174 proyectos de inversión del sector transporte tenían apropiación pendiente por comprometer al 7 de agosto, por $5.026.123.514.237, según el reporte agregado del SIIF Nación. El detalle va en el anexo, entidad por entidad.",
        q:"¿Qué entidades del sector concentran esos $5,03 billones sin comprometer y cuánto alcanzará a contratarse antes del 31 de diciembre?"},
       {t:"El FOPAT acumula $602.504 millones", ref:"p. 29–30", det:"mintra_fopat",
        p:"¿Qué recursos se administran mediante patrimonios autónomos o fiducias?",
        r:"El Fondo para la Promoción de Ascenso Tecnológico, que opera desde el 2 de diciembre de 2024, tenía al 31 de julio de 2026 un saldo de $602.504.732.260: $590.306 millones en la subcuenta de carga pesada, $10.621 millones en taxis y $1.577 millones en carga liviana y volquetas.",
        q:"¿Cuántos vehículos se han repuesto efectivamente con esos $602.504 millones desde diciembre de 2024?"},
       {t:"Tres preguntas sin responder por el término de la Ley 951", ref:"p. 27 y 31–32", det:"mintra_ley951",
        p:"¿Qué déficit de financiación, qué riesgos y qué recomendaciones dejó el empalme?",
        r:"No las responde. Explica que está dentro del término de treinta días del artículo 13 de la Ley 951 de 2005 para verificar los informes de gestión de la administración saliente y que, mientras esa etapa esté en curso, «no se dispone todavía de un diagnóstico definitivo y plenamente validado que pueda ponerse en conocimiento de esa Honorable Comisión».",
        q:"¿En qué fecha vence ese término de treinta días y en qué fecha remitirá el diagnóstico definitivo a la Comisión?"}
     ]}
  ],

/* =======================================================================
   MOTOR DEL TABLERO
   Portada con una entidad por botón; al entrar, el tablero completo
   de esa entidad. Cada cifra abre el detalle con su tabla de origen.
   ======================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nf  = n => n.toLocaleString("es-CO",{maximumFractionDigits:1});
const nfd = (n,d) => n.toLocaleString("es-CO",{minimumFractionDigits:d,maximumFractionDigits:d});
const lento = matchMedia("(prefers-reduced-motion:reduce)").matches;
const COLORES = ["#0F7A3D","#8CD44F","#0B6A5C","#1B4C7E","#B5500F","#7E9C88","#B08A1E","#4E6257"];
const SEV = {grave:"Grave", media:"Media", alerta:"Alerta de gestión", forma:"De forma"};
const ORDEN = ["mintra","aer","ani","ansv","mintic","ane","crc","sspd"];
const SECTORES = ["Transporte","TIC","Vivienda, Ciudad y Territorio"];

Object.keys(DETALLES_EXTRA).forEach(k => { DETALLES[k] = DETALLES_EXTRA[k]; });

const DET_CRC = ["presupuesto","ejecucion","pagos","contratacion","pasivos","judicial",
  "modificaciones","liquidacion","riesgos","sincontrato","vfejecucion","vftramite","adjudicados"];
const DET_COMP = {
  x_presupuesto:["aer","ani","ane","crc"], x_ejecucion:["aer","ani","ane","crc"],
  x_brecha:["aer","ani","ane","crc"], x_pasivos:["aer","ani","ane","crc"],
  x_reservas:["aer","ani","ane","crc"], x_hallazgos:["aer","ani","ane","crc"],
  x_empalme:["mintra","aer","ani","ansv","mintic","ane","crc","sspd"], x_sincontrato:["aer","ani","ane","crc"],
  x_custodia:["aer","ani","ane","crc"], x_jmc:["aer","ani"], x_caraño:["aer","ani"],
  x_nororiente:["aer","ani"], x_revertidos:["aer","ani"]
};
function entDe(id){
  if(!id) return null;
  if(DET_COMP[id]) return "comparado";
  if(id.indexOf("aer_")===0) return "aer";
  if(id.indexOf("ani_")===0) return "ani";
  if(id.indexOf("ane_")===0) return "ane";
  if(id.indexOf("sspd_")===0) return "sspd";
  if(id.indexOf("mintic_")===0) return "mintic";
  if(id.indexOf("ansv_")===0) return "ansv";
  if(id.indexOf("mintra_")===0) return "mintra";
  if(DET_CRC.indexOf(id)>=0) return "crc";
  return null;
}
function tag(k, mini){
  const e = ENT[k]; if(!e) return "";
  return '<span class="ent-tag'+(mini?" mini":"")+'" style="--c:'+e.c+'">'+esc(e.n)+'</span>';
}
function fuenteChip(k, ref){
  return '<span class="fuente-chip">'+tag(k,1)+(ref?'<span class="ref">'+esc(ref)+'</span>':'')+'</span>';
}
const marca = t => t ? '<span class="ref">'+esc(t)+'</span>' : '';

/* =====================  PORTADA  ===================== */
function vistaPortada(){
  const tarjeta = function(k){
    const t = TABLEROS[k], e = ENT[k];
    const props = t.proposiciones.filter(p=>p.respondio).length;
    const total = t.proposiciones.length;
    return '<button class="entrada" data-ir="'+k+'" style="--c:'+e.c+'">'+
      '<span class="sigla">'+esc(e.n)+'</span>'+
      '<span class="nombre">'+esc(e.largo)+'</span>'+
      '<span class="nota">'+esc(t.resumen)+'</span>'+
      '<span class="pie"><span class="cont">'+props+' de '+total+' proposiciones</span>'+
      '<span class="ir">Abrir el tablero →</span></span></button>';
  };
  const tarjetas = SECTORES.map(function(s){
    const ks = ORDEN.filter(k => ENT[k].sector===s);
    if(!ks.length) return "";
    return '<div class="sector"><h3 class="sector-rot">Sector '+esc(s)+' <span>'+ks.length+
      (ks.length===1?' entidad':' entidades')+'</span></h3>'+
      '<div class="entradas">'+ks.map(tarjeta).join("")+'</div></div>';
  }).join("");
  return '<header class="tope portada">'+
      '<h1>Respuesta debate de control político</h1>'+
      '<div class="acciones">'+
        '<button class="btn" id="btn-buscar" type="button">Buscar <kbd>Ctrl K</kbd></button>'+
        '<button class="btn" id="btn-tema" type="button" aria-pressed="false">Contraste</button>'+
      '</div>'+
    '</header>'+
    '<div class="meta">'+
      '<div>Debate<b>Proposiciones 20, 21 y 25 de 2026</b></div>'+
      '<div>Célula legislativa<b>Comisión Sexta · Senado de la República</b></div>'+
      '<div>Corte de la información<b>7 de agosto de 2026</b></div>'+
      '<div>Respuestas radicadas<b>11 y 15 de septiembre de 2026</b></div>'+
    '</div>'+
    '<h2 class="rotulo-seccion">Entidades citadas</h2>'+
    '<p class="instruccion">Cada tablero trae la ficha del documento, el resumen por proposición, el hilo conductual, los datos de respaldo y los hallazgos de la revisión. Toda cifra abre su tabla de origen.</p>'+
    tarjetas+
    '<h2 class="rotulo-seccion">Instrumentos para la sesión</h2>'+
    '<div class="entradas instrumentos">'+
      '<button class="entrada" data-ir="matriz" style="--c:#4A5C7A">'+
        '<span class="sigla">Matriz</span>'+
        '<span class="nombre">Quién respondió qué, pregunta por pregunta</span>'+
        '<span class="nota">Las 18 preguntas del cuestionario general por cada entidad citada: '+(18*ORDEN.length)+' casillas calificadas como responde, parcial, no responde o sin respuesta.</span>'+
        '<span class="pie"><span class="cont">18 preguntas · '+ORDEN.length+' entidades</span><span class="ir">Abrir →</span></span></button>'+
      '<button class="entrada" data-ir="guion" style="--c:#7A4A6B">'+
        '<span class="sigla">Guion</span>'+
        '<span class="nombre">Intervención cronometrada y modo atril</span>'+
        '<span class="nota">Cada momento trae la cifra exacta, la cita textual de la entidad y la pregunta que abre. Marque en vivo si respondió, evadió o quedó pendiente.</span>'+
        '<span class="pie"><span class="cont">'+GUION.bloques.length+' bloques · unos '+Math.round(GUION.bloques.length*1.05)+' minutos</span><span class="ir">Abrir →</span></span></button>'+
      '<button class="entrada" data-ir="cruce" style="--c:'+ENT.cruce.c+'">'+
        '<span class="sigla">Cruce</span>'+
        '<span class="nombre">Contraste entre entidades y cronología</span>'+
        '<span class="nota">Siete puntos donde dos respuestas de la misma sesión no coinciden, y la línea de tiempo del empalme al debate.</span>'+
        '<span class="pie"><span class="cont">'+CRUCES.length+' cruces · '+CRONO.length+' hitos</span><span class="ir">Abrir →</span></span></button>'+
    '</div>'+
    '<p class="seg-portada"><b>Seguimiento del debate:</b> <span id="seg-cuenta">'+textoSeguimiento()+'</span>. '+
      '<button class="btn-claro" id="btn-exportar" type="button">Exportar lo marcado</button></p>'+
    '<p class="pie">Tablero elaborado con las respuestas de las '+ORDEN.length+' entidades citadas por las Proposiciones 20, 21 y 25 de 2026 de la Comisión Sexta del Senado: '+
      ORDEN.map(k=>esc(ENT[k].n)).join(", ")+'. La clasificación de las respuestas y de los hallazgos por gravedad es de esta revisión, no de las entidades.</p>';
}

/* =====================  VISTA DE UNA ENTIDAD  ===================== */
function vistaEntidad(k){
  const t = TABLEROS[k], e = ENT[k];
  const meta = t.meta.map(m=>'<div>'+esc(m[0])+'<b>'+esc(m[1])+'</b></div>').join("");
  const chips = t.proposiciones.map(function(p){
    return '<button class="chip'+(p.respondio?"":" mudo")+'" data-prop="'+p.id+'" aria-expanded="false" aria-controls="panel">'+
      esc(p.rotulo)+'<em>'+esc(p.pie)+'</em></button>';
  }).join("");
  const filas = t.hilo.map(function(r,i){
    return '<tr><td class="n">'+(i+1)+'</td>'+
      '<td data-th="Pregunta base">'+esc(r[0])+marca(r[3])+'</td>'+
      '<td data-th="Respuesta de la entidad">'+esc(r[1])+'</td>'+
      '<td class="rep" data-th="Repregunta">'+
        '<button class="repregunta" type="button" data-det="'+r[4]+'">'+esc(r[2])+
        '<span class="pista">Ver el dato que la sustenta →</span></button>'+
        '<button class="copiar" type="button" data-i="'+i+'" aria-label="Copiar la repregunta '+(i+1)+'">⧉</button>'+
        marcador(k+"-h"+i)+'</td></tr>';
  }).join("");
  const kpis = t.kpis.map(function(x){
    return '<div class="kpi dato'+(x.alerta?' alerta':'')+'" data-det="'+x.d+'" data-foco="'+(x.f||"")+'"'+
      ' tabindex="0" role="button" aria-label="Ver el detalle de: '+esc(x.t)+'">'+
      '<span class="lupa" aria-hidden="true">⌕</span><b>'+esc(x.v)+'</b><span>'+esc(x.t)+'</span>'+
      fuenteChip(k, x.r)+'</div>';
  }).join("");
  const halls = t.hallazgos.map(function(f){
    return '<div class="hallazgo'+(f.det?' dato':'')+'"'+(f.det?' data-det="'+f.det+'" tabindex="0" role="button"':'')+'>'+
      '<h5><span class="sev '+f.s+'">'+SEV[f.s]+'</span>'+esc(f.t)+'</h5>'+
      '<p>'+esc(f.d)+'</p>'+
      (f.q && f.q!=="—" ? '<p class="preg">'+esc(f.q)+'</p>' : '')+
      '<span class="pag">'+esc(f.p)+'</span></div>';
  }).join("");
  const cuenta = {};
  t.hallazgos.forEach(f=>{ cuenta[f.s] = (cuenta[f.s]||0)+1; });
  const resumenHall = ["grave","media","alerta","forma"].filter(s=>cuenta[s])
    .map(s=>'<span class="sev '+s+'">'+SEV[s]+' '+cuenta[s]+'</span>').join(" ");

  return '<header class="tope" style="--c:'+e.c+'">'+
      '<button class="btn volver" data-ir="portada" type="button">← Entidades</button>'+
      '<h1>'+esc(e.n)+' <span class="sub">'+esc(t.titulo)+'</span></h1>'+
      '<div class="acciones">'+
        '<button class="btn" id="btn-buscar" type="button">Buscar</button>'+
        '<button class="btn" id="btn-print" type="button">Imprimir</button>'+
        '<button class="btn" id="btn-tema" type="button" aria-pressed="false">Contraste</button>'+
      '</div></header>'+
    '<div class="meta">'+meta+'</div>'+
    '<div class="lectura lectura-ent">'+t.lectura.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>'+

    '<section class="respuestas" aria-label="Proposiciones respondidas">'+
      '<div class="rotulo" style="background:'+e.c+'"><b>Respuestas</b>'+
        '<span>Cada proposición abre el resumen del debate en cinco puntos: pregunta base, lo que respondió '+esc(e.n)+' y la repregunta.</span></div>'+
      '<div class="filas"><div class="fila">'+
        '<div class="etiqueta etiqueta--prop" style="background:'+e.c+'">Proposiciones<small>Resumen en 5 puntos</small></div>'+
        '<div class="botones" id="botones-prop">'+chips+'</div>'+
      '</div></div>'+
    '</section>'+
    '<div class="panel" id="panel" hidden tabindex="-1" role="region" aria-label="Detalle de la proposición"></div>'+

    '<section class="seccion" aria-label="Hilo conductual">'+
      '<div class="barra" style="background:'+e.c+'"><h2>Resumen de las respuestas, hilo conductual del debate</h2>'+
        '<button class="btn" id="btn-copiar-todo" type="button">Copiar las repreguntas</button>'+
        '<span class="apunte">Cada respuesta abre la siguiente pregunta. La columna de la derecha está lista para leer en plenaria.</span></div>'+
      '<div class="tabla-caja"><table>'+
        '<thead><tr><th>#</th><th>Pregunta base</th><th>Respuesta de '+esc(e.n)+'</th><th>Repregunta</th></tr></thead>'+
        '<tbody id="tbody-hilo">'+filas+'</tbody></table></div>'+
    '</section>'+

    '<section class="seccion" aria-label="Respaldo y datos">'+
      '<div class="barra" style="background:'+e.c+'"><h2>Respaldo y datos del debate</h2>'+
        '<span class="apunte">Todas las cifras provienen de la respuesta de '+esc(e.n)+'. '+esc(ENT[k].doc)+'. Toque cualquier dato para ver su tabla de origen.</span></div>'+
      '<div class="kpis">'+kpis+'</div>'+
      '<div class="graficas" id="graficas"></div>'+
    '</section>'+

    '<section class="seccion" aria-label="Hallazgos">'+
      '<div class="barra" style="background:'+e.c+'"><h2>Hallazgos de la revisión del documento</h2>'+
        '<span class="apunte">Clasificación de esta revisión, no de la entidad: '+resumenHall+'</span></div>'+
      '<div class="lista-hallazgos">'+halls+'</div>'+
    '</section>'+

/* =====================  GRÁFICAS  ===================== */
function act(det, foco, tipT, tipV, etiqueta){
  return ' class="dato" data-det="'+det+'" data-foco="'+esc(foco||"")+'"'+
         ' data-tip="&lt;b&gt;'+esc(tipT)+'&lt;/b&gt;'+esc(tipV)+' · clic para ver el detalle"'+
         ' tabindex="0" role="button" aria-label="'+esc(etiqueta)+'. Abrir detalle"';
}
function fmtVal(v, g){
  const d = g.decimales||0;
  if(g.fmt==="M") return "$"+(d?nfd(v,d):nf(v))+" M";
  return nf(v);
}
function gBarrasPct(g){
  const n = g.series.length, altoF = 26 + n*17, w = 214;
  const alto = g.filas.length*altoF + (g.ref60?24:6);
  const x60 = w*0.6;
  let s = g.ref60 ? '<line x1="'+x60+'" y1="4" x2="'+x60+'" y2="'+(alto-22)+'" stroke="#B5500F" stroke-width="1.5" stroke-dasharray="4 3"/>'+
      '<text x="'+(x60+5)+'" y="'+(alto-8)+'" font-family="Barlow,sans-serif" font-size="10" fill="#B5500F">60% del año transcurrido</text>' : "";
  g.filas.forEach(function(f,i){
    const y = i*altoF+14;
    const tip = g.series.map((se,j)=>se+" "+nf(f.v[j])+"%").join(" · ");
    s += '<g'+act(g.det, f.k, f.k, tip, f.k)+'>'+
      '<rect x="-4" y="'+(y-12)+'" width="'+(w+96)+'" height="'+(altoF-4)+'" fill="transparent"/>'+
      '<text x="0" y="'+y+'" font-family="Barlow,sans-serif" font-size="11.4" fill="currentColor">'+esc(f.k)+'</text>';
    f.v.forEach(function(val,j){
      const yy = y+8+j*17;
      s += '<rect x="0" y="'+yy+'" width="'+w+'" height="11" rx="2" fill="currentColor" opacity=".07"/>'+
           '<rect x="0" y="'+yy+'" width="0" data-w="'+(w*val/100).toFixed(1)+'" height="11" rx="2" fill="'+COLORES[j]+'"/>'+
           '<text x="'+(w*val/100+6).toFixed(1)+'" y="'+(yy+9.3)+'" font-family="Barlow,sans-serif" font-size="10" fill="currentColor">'+nf(val)+'% '+esc(g.series[j].toLowerCase())+'</text>';
    });
    s += '</g>';
  });
  return '<svg viewBox="0 0 '+(w+96)+' '+alto+'" role="img" aria-label="'+esc(g.t)+'">'+s+'</svg>'+
    '<div class="leyenda">'+g.series.map((se,j)=>'<div><i style="background:'+COLORES[j]+'"></i>'+esc(se)+'</div>').join("")+'</div>';
}
function gBarrasValor(g, cuenta){
  const max = Math.max.apply(null, g.filas.map(f=>f.v)), w = 200, altoF = 44;
  const alto = g.filas.length*altoF+6;
  let s = "";
  g.filas.forEach(function(f,i){
    const y = i*altoF+6, largo = Math.max(2, w*f.v/(max||1));
    const color = f.gris ? "#8FA697" : f.alerta ? "#B5500F" : (g.color||COLORES[0]);
    const txt = cuenta ? nf(f.v) : fmtVal(f.v,g);
    s += '<g'+act(g.det, f.k, f.k, txt, f.k+", "+txt)+'>'+
      '<rect x="-4" y="'+(y-4)+'" width="'+(w+104)+'" height="'+(altoF-4)+'" fill="transparent"/>'+
      '<text x="0" y="'+(y+10)+'" font-family="Barlow,sans-serif" font-size="11.2" fill="currentColor">'+esc(f.k)+'</text>'+
      '<rect x="0" y="'+(y+15)+'" width="0" data-w="'+largo.toFixed(1)+'" height="15" rx="3" fill="'+color+'"/>'+
      '<text x="'+(largo+7).toFixed(1)+'" y="'+(y+26.5)+'" font-family="Barlow,sans-serif" font-size="10.4" fill="currentColor">'+esc(txt)+'</text></g>';
  });
  return '<svg viewBox="0 0 '+(w+104)+' '+alto+'" role="img" aria-label="'+esc(g.t)+'">'+s+'</svg>';
}
function gAvance(g){
  const w = 168, altoF = 40, alto = g.filas.length*altoF+6;
  let s = "";
  g.filas.forEach(function(f,i){
    const y = i*altoF+6, largo = Math.max(2, w*f.v/100);
    const color = f.gris ? "#8FA697" : f.v<10 ? "#E5484D" : f.v<60 ? "#B08A1E" : COLORES[0];
    const val = f.gris ? "sin dato" : nf(f.v)+"%";
    s += '<g'+act(g.det, f.k, f.k, val+" · $"+nf(f.m)+" M", f.k+", "+val)+'>'+
      '<rect x="-4" y="'+(y-4)+'" width="'+(w+130)+'" height="'+(altoF-3)+'" fill="transparent"/>'+
      '<text x="0" y="'+(y+10)+'" font-family="Barlow,sans-serif" font-size="11.2" fill="currentColor">'+esc(f.k)+'</text>'+
      '<rect x="0" y="'+(y+14)+'" width="'+w+'" height="13" rx="3" fill="currentColor" opacity=".07"/>'+
      '<rect x="0" y="'+(y+14)+'" width="0" data-w="'+largo.toFixed(1)+'" height="13" rx="3" fill="'+color+'"/>'+
      '<text x="'+(w+8)+'" y="'+(y+24.5)+'" font-family="Barlow,sans-serif" font-size="10.4" fill="currentColor">'+esc(val)+' · $'+nf(f.m)+' M</text></g>';
  });
  return '<svg viewBox="0 0 '+(w+132)+' '+alto+'" role="img" aria-label="'+esc(g.t)+'">'+s+'</svg>';
}
function gDonut(g){
  const R=78, r=52, cx=100, cy=100, total=g.datos.reduce((a,b)=>a+b.v,0);
  let ang=-Math.PI/2, paths="";
  g.datos.forEach(function(d,i){
    const a=d.v/total*Math.PI*2, fin=ang+a, grande=a>Math.PI?1:0;
    const pt=(rad,t)=>[cx+rad*Math.cos(t), cy+rad*Math.sin(t)].map(n=>n.toFixed(2)).join(" ");
    const val = nf(d.v)+" · "+nfd(d.v/total*100,1)+"%";
    paths += '<g'+act(g.det, d.k, d.k, val, d.k)+' style="animation-delay:'+(i*45)+'ms">'+
      '<path class="rebana" d="M '+pt(R,ang)+' A '+R+' '+R+' 0 '+grande+' 1 '+pt(R,fin)+
      ' L '+pt(r,fin)+' A '+r+' '+r+' 0 '+grande+' 0 '+pt(r,ang)+' Z" fill="'+COLORES[i%COLORES.length]+'"/></g>';
    ang=fin;
  });
  return '<svg class="rosca'+(lento?"":" entra")+'" viewBox="0 0 200 200" role="img" aria-label="'+esc(g.t)+'">'+paths+
    '<text x="100" y="97" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="23" font-weight="700" fill="currentColor">'+esc(g.centro)+'</text>'+
    '<text x="100" y="115" text-anchor="middle" font-family="Barlow,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">'+esc(g.sub)+'</text></svg>'+
    '<div class="leyenda">'+g.datos.map(function(d,i){
      return '<div'+act(g.det, d.k, d.k, nf(d.v)+" · "+nfd(d.v/total*100,1)+"%", d.k)+
        '><i style="background:'+COLORES[i%COLORES.length]+'"></i>'+esc(d.k)+
        ' <span>'+nfd(d.v/total*100,1)+'%</span></div>';
    }).join("")+'</div>';
}
function gApiladas(g){
  const cs = g.colores || COLORES;
  const max = g.max, w = 360, hh = 196, base = hh-26, anchoB = Math.min(54, (w/g.filas.length)-16),
        paso = w/g.filas.length, util = base-22;
  let s = "";
  const pasos = 5, inc = max/pasos;
  for(let t=0;t<=max;t+=inc){
    const y = base - t/max*util;
    s += '<line x1="-6" y1="'+y.toFixed(1)+'" x2="'+w+'" y2="'+y.toFixed(1)+'" stroke="currentColor" opacity="'+(t===0?".28":".12")+'"/>'+
         '<text x="-10" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-family="Barlow,sans-serif" font-size="9.5" fill="currentColor" opacity=".55">'+nf(t)+'</text>';
  }
  g.filas.forEach(function(f,i){
    const x = i*paso+(paso-anchoB)/2; let y = base; const tot = f.v.reduce((a,b)=>a+b,0);
    let piezas = "";
    f.v.forEach(function(val,j){
      const alto = val/max*util; y -= alto;
      if(val>0) piezas += '<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+anchoB+'" height="'+alto.toFixed(1)+'" fill="'+cs[j]+'"/>'+
        (alto>13?'<text x="'+(x+anchoB/2)+'" y="'+(y+alto/2+4).toFixed(1)+'" text-anchor="middle" font-family="Barlow,sans-serif" font-size="10.5" fill="#fff">'+val+'</text>':'');
    });
    const tip = f.v.map((v,j)=>g.series[j]+" "+v).join(" · ");
    s += '<g'+act(g.det, f.k, f.k+": "+tot, tip, f.k)+'>'+
      '<rect x="'+x+'" y="0" width="'+anchoB+'" height="'+base+'" fill="transparent"/>'+piezas+
      '<text x="'+(x+anchoB/2)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="15" fill="currentColor">'+tot+'</text>'+
      '<text x="'+(x+anchoB/2)+'" y="'+(base+17)+'" text-anchor="middle" font-family="Barlow,sans-serif" font-size="11" fill="currentColor" opacity=".75">'+esc(f.k)+'</text></g>';
  });
  return '<svg viewBox="-26 0 '+(w+28)+' '+hh+'" role="img" aria-label="'+esc(g.t)+'">'+s+'</svg>'+
    '<div class="leyenda">'+g.series.map((se,j)=>'<div><i style="background:'+cs[j]+'"></i>'+esc(se)+'</div>').join("")+'</div>';
}
function gCascada(g){
  const cs = [COLORES[0], COLORES[1], COLORES[3], "#B5500F"];
  const max = Math.max.apply(null, g.pasos.map(p=>p[2]));
  const w = 208, altoF = 40, alto = g.pasos.length*altoF+6;
  let s = "";
  g.pasos.forEach(function(p,i){
    const y = i*altoF+6, x0 = w*p[1]/max, x1 = w*p[2]/max, largo = Math.max(2, x1-x0);
    const val = "$"+nf(p[2]-p[1])+" M";
    s += '<g'+act(g.det, p[0], p[0], val, p[0]+", "+val)+'>'+
      '<rect x="-4" y="'+(y-4)+'" width="'+(w+104)+'" height="'+(altoF-4)+'" fill="transparent"/>'+
      '<text x="0" y="'+(y+10)+'" font-family="Barlow,sans-serif" font-size="11.2" fill="currentColor">'+esc(p[0])+'</text>'+
      '<rect x="'+x0.toFixed(1)+'" y="'+(y+15)+'" width="0" data-w="'+largo.toFixed(1)+'" height="15" rx="3" fill="'+cs[p[3]]+'"/>'+
      '<text x="'+(x0+largo+7).toFixed(1)+'" y="'+(y+26.5)+'" font-family="Barlow,sans-serif" font-size="10.4" fill="currentColor">'+esc(val)+'</text></g>';
  });
  return '<svg viewBox="0 0 '+(w+104)+' '+alto+'" role="img" aria-label="'+esc(g.t)+'">'+s+'</svg>';
}
function pintarGraficas(k){
  const cont = $("#graficas"); if(!cont) return;
  cont.innerHTML = TABLEROS[k].graficas.map(function(g){
    let cuerpo = "";
    if(g.tipo==="pct") cuerpo = gBarrasPct(g);
    else if(g.tipo==="valor") cuerpo = gBarrasValor(g,false);
    else if(g.tipo==="cuenta") cuerpo = gBarrasValor(g,true);
    else if(g.tipo==="avance") cuerpo = gAvance(g);
    else if(g.tipo==="donut") cuerpo = gDonut(g);
    else if(g.tipo==="apiladas") cuerpo = gApiladas(g);
    else if(g.tipo==="cascada") cuerpo = gCascada(g);
    return '<div class="grafica"><h4>'+esc(g.t)+'</h4><p class="lectura">'+esc(g.l)+'</p>'+cuerpo+
      '<div class="leyenda" style="margin-top:12px"><div>'+fuenteChip(k, g.ref)+'</div></div></div>';
  }).join("");
  animarBarras();
}
function animarBarras(){
  const barras = document.querySelectorAll("#graficas rect[data-w]");
  if(!barras.length) return;
  if(lento){ barras.forEach(r=>r.setAttribute("width", r.dataset.w)); return; }
  const t0 = performance.now(), dur = 620;
  (function paso(t){
    const kk = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-kk,3);
    barras.forEach(r=>r.setAttribute("width", (r.dataset.w*e).toFixed(1)));
    if(kk<1) requestAnimationFrame(paso);
  })(t0);
}

caja.addEventListener("keydown", function(e){

});

function aviso(txt){
  const a = $("#aviso"); a.textContent = txt; a.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(()=>{a.hidden = true;}, 2200);
}
function copiar(txt, boton){
  const ok = ()=>{ aviso("Copiado"); if(boton){ boton.classList.add("ok"); setTimeout(()=>boton.classList.remove("ok"),1400);} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>aviso("No se pudo copiar"));
  } else {
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ aviso("No se pudo copiar"); }
    document.body.removeChild(ta);
  }
}

/* =====================  NAVEGACIÓN  ===================== */
const app = $("#app");
let vistaActual = "portada";
function ir(destino, empujar){
  vistaActual = destino;
  if(destino==="portada") app.innerHTML = vistaPortada();
  else if(destino==="cruce") app.innerHTML = vistaCruce();
  else if(destino==="matriz"){
    app.innerHTML = vistaMatriz();
    document.querySelectorAll("[data-cel]").forEach(function(b){
      b.addEventListener("click", function(){
        const pz = b.dataset.cel.split("-");
        abrirCelda(pz[0], +pz[1]);
      });
    });
  }
  else if(destino==="guion"){
    app.innerHTML = vistaGuion();
    document.querySelectorAll("[data-copiar]").forEach(function(b){
      b.addEventListener("click", function(){
        const x = GUION.bloques[+b.dataset.copiar];
        copiar(x.t+"\n\n"+x.dice+"\n\nPREGUNTA: "+x.preg, b);
      });
    });
    const ba = $("#btn-atril"); if(ba) ba.addEventListener("click", ()=>abrirAtril(0));
    const bg = $("#btn-copiar-guion"); if(bg) bg.addEventListener("click", ()=>copiar(textoGuion()));
  }
  else {
    app.innerHTML = vistaEntidad(destino);
    pintarGraficas(destino);
    const t = TABLEROS[destino];
    document.querySelectorAll("#botones-prop .chip").forEach(function(c){
      c.addEventListener("click", function(){
        if(c.getAttribute("aria-expanded")==="true") cerrarPanel();
        else abrirProp(destino, c.dataset.prop);
      });
    });
    document.querySelectorAll(".copiar").forEach(b =>
      b.addEventListener("click", ()=>copiar(t.hilo[+b.dataset.i][2], b)));
    const bt = $("#btn-copiar-todo");
    if(bt) bt.addEventListener("click", ()=>copiar(
      t.hilo.map((r,i)=>(i+1)+". "+r[2]).join("\n\n")));
  }
  const bp = $("#btn-print"); if(bp) bp.addEventListener("click", ()=>window.print());
  const bb = $("#btn-buscar"); if(bb) bb.addEventListener("click", abrirBuscador);
  const bx = $("#btn-exportar"); if(bx) bx.addEventListener("click", exportarSeguimiento);
  const bTema = $("#btn-tema");
  if(bTema){
    bTema.setAttribute("aria-pressed", String(document.documentElement.getAttribute("data-theme")==="dark"));
    bTema.addEventListener("click", function(){
      const oscuro = document.documentElement.getAttribute("data-theme")==="dark";
      document.documentElement.setAttribute("data-theme", oscuro ? "light" : "dark");
      bTema.setAttribute("aria-pressed", String(!oscuro));
    });
  }
  document.querySelectorAll("[data-ir]").forEach(b =>
    b.addEventListener("click", ()=>ir(b.dataset.ir, true)));
  if(empujar!==false) history.replaceState(null,"", destino==="portada" ? location.pathname : "#/"+destino);
  window.scrollTo({top:0, behavior:"auto"});
  const titulos = {portada:"Respuesta debate de control político — Comisión Sexta del Senado",
    cruce:"Cruce entre entidades — control político", matriz:"Matriz de respuestas — control político",
    guion:"Guion de intervención — control político"};
  document.title = titulos[destino] || (ENT[destino].n+" — tablero de control político");
}

/* apertura de detalles por clic o teclado en toda la página */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-det]");
  if(el){ e.preventDefault(); abrirDetalle(el.dataset.det, el.dataset.foco || ""); }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){
    if(!modal.hidden){ cerrarDetalle(); return; }
    const p = $("#panel"); if(p && !p.hidden){ cerrarPanel(); return; }
    if(vistaActual!=="portada"){ ir("portada"); }
    return;
  }
  if(e.key!=="Enter" && e.key!==" ") return;
  const el = e.target.closest ? e.target.closest("[data-det]") : null;
  if(el && el.tagName.toLowerCase()!=="button"){ e.preventDefault(); abrirDetalle(el.dataset.det, el.dataset.foco || ""); }
});
document.addEventListener("mousemove", function(e){
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if(!el){ tip.hidden = true; return; }
  tip.innerHTML = el.dataset.tip;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if(x + r.width > innerWidth - 10) x = e.clientX - r.width - 14;
  if(y + r.height > innerHeight - 10) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("scroll", ()=>{ tip.hidden = true; }, true);
const VISTAS = ["cruce","matriz","guion"];
function rutaValida(h){ return (TABLEROS[h] || VISTAS.indexOf(h)>=0) ? h : "portada"; }
window.addEventListener("hashchange", function(){
  ir(rutaValida(location.hash.replace("#/","")), false);
});

/* el arranque lo dispara app_extra al final del bundle */
function arrancar(){ ir(rutaValida(location.hash.replace("#/","")), false); }
